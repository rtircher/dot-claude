name: board tests

# Run the board plugin's unit tests on PRs that touch it.
on:
  pull_request:
    paths:
      - "plugins/board/**"
      - ".github/workflows/board-tests.yml"

permissions:
  contents: read

concurrency:
  group: board-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure git identity
        run: |
          git config --global user.name "board-ci"
          git config --global user.email "board-ci@example.invalid"

      - name: Run board tests
        run: python3 -m unittest discover -s plugins/board/tests -t plugins/board

      - name: Run glance pane tests
        run: node --test plugins/board/hooks/render.test.mjs
