name: quests tests

# Run the quests plugin's unit tests on PRs that touch it.
on:
  pull_request:
    paths:
      - "plugins/quests/**"
      - ".github/workflows/quests-tests.yml"

permissions:
  contents: read

concurrency:
  group: quests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure git identity
        run: |
          git config --global user.name "quests-ci"
          git config --global user.email "quests-ci@example.invalid"

      - name: Run quests tests
        run: python3 -m unittest discover -s plugins/quests/tests -t plugins/quests

      - name: Run glance pane tests
        run: node --test plugins/quests/hooks/render.test.mjs plugins/quests/hooks/commands.test.mjs
